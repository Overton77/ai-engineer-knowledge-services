services:
  docling-serve:
    image: ghcr.io/docling-project/docling-serve@sha256:f8b324448e7c9e66083049727aaa90e3e65e88f0d7796624597a29d04183198b
    read_only: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5001"
    environment:
      DOCLING_SERVE_ENABLE_UI: "0"
      DOCLING_SERVE_ENG_LOC_NUM_WORKERS: "1"
    tmpfs:
      - /tmp:size=2g,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 8g
    cpus: 4
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
